<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CF Worker Chat</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply appearance before stylesheet loading to avoid a light flash.
      (() => {
        let preference = "system";
        try { preference = localStorage.getItem("cf-worker-chat.theme.v1") || "system"; } catch {}
        document.documentElement.dataset.theme = preference === "light" || preference === "dark"
          ? preference : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css"
    />
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/highlight.min.js"
    ></script>
  </head>
  <body>
    <a class="skip-link" href="#chatWorkspace">跳到对话区域</a>

    <div class="page-shell">
      <header id="topBar" class="top-bar panel">
        <div id="topBarSurface" class="top-bar-surface">
          <div class="top-bar-controls">
            <button
              id="sessionSidebarToggle"
              class="ghost-button compact-button sidebar-toggle-button"
              type="button"
              aria-expanded="false"
              aria-controls="sessionSidebar"
            >
              <span id="sessionSidebarToggleIcon" class="sidebar-toggle-icon" aria-hidden="true">
                <svg viewBox="0 0 20 20" fill="none" focusable="false" aria-hidden="true">
                  <rect x="3" y="4" width="4" height="12" rx="1.6" fill="currentColor"></rect>
                  <path
                    d="M10 6H16"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  ></path>
                  <path
                    d="M10 10H16"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  ></path>
                  <path
                    d="M10 14H16"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  ></path>
                </svg>
              </span>
              <span id="sessionSidebarToggleLabel" class="sidebar-toggle-label">对话记录</span>
            </button>

            <div id="modelPicker" class="model-picker">
              <div
                id="featuredModelList"
                class="featured-model-list"
                aria-label="featured models"
              ></div>
              <button
                id="modelCatalogToggle"
                class="ghost-button compact-button model-catalog-toggle-button"
                type="button"
                aria-expanded="false"
                aria-controls="modelCatalogPanel"
              >
                <span id="modelCatalogToggleIcon" class="model-catalog-toggle-icon" aria-hidden="true">
                  <svg viewBox="0 0 20 20" fill="none" focusable="false" aria-hidden="true">
                    <rect x="4" y="4" width="4" height="4" rx="1.2" fill="currentColor"></rect>
                    <rect x="12" y="4" width="4" height="4" rx="1.2" fill="currentColor"></rect>
                    <rect x="4" y="12" width="4" height="4" rx="1.2" fill="currentColor"></rect>
                    <rect x="12" y="12" width="4" height="4" rx="1.2" fill="currentColor"></rect>
                  </svg>
                </span>
                <span id="modelCatalogToggleLabel" class="model-catalog-toggle-label">更多模型</span>
              </button>
            </div>
          </div>

          <section id="modelCatalogPanel" class="floating-panel model-catalog-panel" aria-label="模型目录" hidden>
            <div id="modelCatalogSurface" class="model-catalog-surface">
              <div class="catalog-heading">
                <label class="field-label" for="modelSearchInput">搜索模型</label>
                <span id="modelCatalogCount" class="catalog-count" aria-live="polite"></span>
              </div>
              <input
                id="modelSearchInput"
                class="model-search-input"
                type="search"
                placeholder="搜索模型或提供方"
                autocomplete="off"
              />
              <div id="modelCatalogList" class="model-catalog-list"></div>
              <p class="catalog-footnote">上下文为模型规格；本站携带最近 12 条历史消息。标有「付费访问」的模型需要 Workers 付费计划或 AI Gateway 预付额度。</p>
            </div>
          </section>
        </div>

        <div
          id="chatStatus"
          class="visually-hidden"
          data-state="idle"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          准备就绪
        </div>
      </header>

      <main id="chatWorkspace" class="chat-layout">
        <div
          id="sessionSidebarBackdrop"
          class="session-sidebar-backdrop"
          data-open="false"
        ></div>

        <aside id="sessionSidebar" class="session-sidebar panel" data-open="false">
          <div id="sessionSidebarHeader" class="session-sidebar-header">
            <div class="session-sidebar-actions">
              <button
                id="newChatButton"
                class="ghost-button sidebar-new-chat-button"
                type="button"
              >
                新对话
              </button>
              <button
                id="sessionSidebarCloseButton"
                class="ghost-button compact-button mobile-only-button"
                type="button"
              >
                收起
              </button>
            </div>

            <div class="session-search-toolbar">
              <div class="session-search-field">
                <label class="visually-hidden" for="sessionSearchInput">搜索对话</label>
                <input
                  id="sessionSearchInput"
                  class="session-search-input"
                  type="search"
                  placeholder="搜索标题、内容或模型"
                  autocomplete="off"
                  inputmode="search"
                />
                <button
                  id="sessionSearchClearButton"
                  class="ghost-button compact-button session-search-clear-button"
                  type="button"
                  aria-label="清除对话搜索"
                  hidden
                >
                  清除
                </button>
              </div>
              <p id="sessionSearchMeta" class="session-search-meta" aria-live="polite"></p>
            </div>
          </div>

          <div id="sessionSidebarContent" class="session-sidebar-content">
            <div id="sessionList" class="session-list"></div>
          </div>

          <div class="session-sidebar-footer">
            <div class="appearance-control">
              <label for="themePreference">外观</label>
              <select id="themePreference" class="theme-select" aria-label="外观主题">
                <option value="system">跟随系统</option>
                <option value="light">浅色</option>
                <option value="dark">深色</option>
              </select>
            </div>
            <button
              id="clearAllSessionsButton"
              class="ghost-button compact-button sidebar-secondary-action danger-button"
              type="button"
            >
              清空全部
            </button>
          </div>
        </aside>

        <section id="chatColumnSurface" class="chat-column panel">
          <div id="chatHistorySurface" class="chat-history-surface">
            <div id="chatHistory" class="chat-history" aria-live="polite"></div>
          </div>

          <div id="chatComposerShell" class="chat-composer-shell">
            <form id="chatForm" class="composer" autocomplete="off">
              <div id="composerInputShell" class="composer-input-shell">
                <textarea
                  id="userInput"
                  aria-label="输入消息"
                  rows="1"
                  maxlength="12000"
                  placeholder="输入消息"
                ></textarea>
                <button
                  id="sendButton"
                  class="primary-button composer-send-button"
                  type="submit"
                >
                  发送
                </button>
                <button id="stopButton" class="ghost-button composer-stop-button" type="button" hidden>停止生成</button>
              </div>
              <div class="composer-footer">
                <span id="composerModelLabel" class="composer-model-label"></span>
                <span class="composer-key-hint">Enter 发送 · Shift+Enter 换行</span>
              </div>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
